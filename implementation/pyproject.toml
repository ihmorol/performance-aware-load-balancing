[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plb"
version = "0.1.0"
description = "Dispatcher, workers, and experiment tools for the performance-aware load balancing study"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
# dispatcher (#3) and experiments (#4) are listed before they exist, so the two
# wave 2 branches don't both edit this line. Rerun `pip install -e . --no-deps`
# after a new package folder appears.
include = ["plb*", "worker*", "dispatcher*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
